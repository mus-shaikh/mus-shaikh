<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="544" viewBox="0 0 1000 544" role="img" aria-label="Experience: Data Engineering Intern at MPUDC, Data Visualization Intern at Infosys Springboard"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#121D3D"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17274F"/><stop offset="1" stop-color="#0F1A36"/></linearGradient><clipPath id="clip"><rect width="1000" height="544" rx="18"/></clipPath></defs><style>.f{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.rise{animation:rise .9s ease-out backwards}.n{animation:pulse 3.4s ease-in-out infinite}.cur{animation:blink 1s steps(1) infinite}</style><rect width="1000" height="544" rx="18" fill="url(#bg)"/><g clip-path="url(#clip)"><rect x="40" y="33" width="5" height="28" rx="2.5" fill="url(#acc)"/><text class="f" x="58" y="54" font-size="24" font-weight="700" fill="#F1F5F9" text-anchor="start" >Experience</text><rect x="76" y="88" width="894" height="200" rx="14" fill="url(#tile)" stroke="#1E3A66" stroke-opacity=".9"/><text class="f" x="100" y="126" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="start" >Data Engineering Intern</text><text class="f" x="100" y="150" font-size="14" font-weight="600" fill="#60A5FA" text-anchor="start" >Madhya Pradesh Urban Development Company (MPUDC)</text><rect x="788" y="106" width="158" height="26" rx="13.0" fill="#3B82F6" fill-opacity="0.16" stroke="#3B82F6" stroke-opacity=".55"/><text class="f" x="867.0" y="123.375" font-size="12.5" font-weight="600" fill="#E2E8F0" text-anchor="middle" >Aug 2026 – Present</text><circle cx="106" cy="180" r="3" fill="#60A5FA"/><text class="f" x="120" y="184" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >Engineered data pipelines with Databricks, PySpark, Python and SQL, using a Bronze → Silver → Gold</text><text class="f" x="120" y="204" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >architecture for cleaning, transformation and analysis.</text><circle cx="106" cy="228" r="3" fill="#60A5FA"/><text class="f" x="120" y="232" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >Built interactive Databricks dashboards and SQL Server data workflows, with planned FastAPI integration</text><text class="f" x="120" y="252" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >for application-based project data ingestion and updates.</text><rect x="76" y="310" width="894" height="200" rx="14" fill="url(#tile)" stroke="#1E3A66" stroke-opacity=".9"/><text class="f" x="100" y="348" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="start" >Data Visualization Intern</text><text class="f" x="100" y="372" font-size="14" font-weight="600" fill="#60A5FA" text-anchor="start" >Infosys Springboard</text><rect x="781" y="328" width="165" height="26" rx="13.0" fill="#3B82F6" fill-opacity="0.16" stroke="#3B82F6" stroke-opacity=".55"/><text class="f" x="863.5" y="345.375" font-size="12.5" font-weight="600" fill="#E2E8F0" text-anchor="middle" >Feb 2026 – Apr 2026</text><circle cx="106" cy="402" r="3" fill="#60A5FA"/><text class="f" x="120" y="406" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >Cleaned and analysed large tourism datasets in Power BI, surfacing location-based trends through</text><text class="f" x="120" y="426" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >interactive dashboards and geospatial maps for non-technical stakeholders.</text><circle cx="106" cy="450" r="3" fill="#60A5FA"/><text class="f" x="120" y="454" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >Built and deployed a Streamlit web app with authentication and embedded AI-generated insights, taking a</text><text class="f" x="120" y="474" font-size="13.5" font-weight="400" fill="#CBD5E1" text-anchor="start" >project from data to production.</text><line x1="44" y1="124" x2="44" y2="346" stroke="url(#acc)" stroke-width="2" stroke-opacity=".7"/><circle cx="44" cy="124" r="11" fill="#3B82F6" fill-opacity=".18"/><circle cx="44" cy="124" r="6" fill="#60A5FA"/><circle cx="44" cy="346" r="11" fill="#3B82F6" fill-opacity=".18"/><circle cx="44" cy="346" r="6" fill="#60A5FA"/></g><rect x=".5" y=".5" width="999" height="543" rx="18" fill="none" stroke="#1E3A66" stroke-opacity=".8"/></svg>