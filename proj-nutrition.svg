<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="480" height="365" viewBox="0 0 480 365" role="img" aria-label="AI Nutrition Planner"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#121D3D"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17274F"/><stop offset="1" stop-color="#0F1A36"/></linearGradient><clipPath id="clip"><rect width="480" height="365" rx="18"/></clipPath></defs><style>.f{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.rise{animation:rise .9s ease-out backwards}.n{animation:pulse 3.4s ease-in-out infinite}.cur{animation:blink 1s steps(1) infinite}</style><rect width="480" height="365" rx="18" fill="url(#bg)"/><g clip-path="url(#clip)"><rect width="480" height="5" fill="#10B981"/><circle cx="430" cy="30" r="150" fill="#10B981" fill-opacity="0.09"/><text class="m" x="28" y="44" font-size="11" font-weight="700" fill="#10B981" text-anchor="start" letter-spacing="2">PROJECT 01</text><text class="f" x="28" y="78" font-size="21" font-weight="700" fill="#F8FAFC" text-anchor="start" >AI Nutrition Planner</text><rect x="28" y="98" width="97" height="26" rx="13.0" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity=".55"/><text class="f" x="76.5" y="115.2" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle" >Agentic AI</text><rect x="133" y="98" width="48" height="26" rx="13.0" fill="#8B5CF6" fill-opacity="0.16"