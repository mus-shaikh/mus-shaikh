<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="About Muskan Shaikh"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#121D3D"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17274F"/><stop offset="1" stop-color="#0F1A36"/></linearGradient><clipPath id="clip"><rect width="1000" height="300" rx="18"/></clipPath></defs><style>.f{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.rise{animation:rise .9s ease-out backwards}.n{animation:pulse 3.4s ease-in-out infinite}.cur{animation:blink 1s steps(1) infinite}</style><rect width="1000" height="300" rx="18" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="900" cy="20" r="200" fill="#6366F1" fill-opacity="0.1"/><rect x="40" y="37" width="5" height="28" rx="2.5" fill="url(#acc)"/><text class="f" x="58" y="58" font-size="24" font-weight="700" fill="#F1F5F9" text-anchor="start" >About Me</text><text class="f" x="40" y="108" font-size="15" font-weight="400" fill="#CBD5E1" text-anchor="start" >I&#x27;m a Computer Science &amp; Business Systems student who loves</text><text class="f" x="40" y="135" font-size="15" font-weight="400" fill="#CBD5E1" text-anchor="start" >turning raw data into clear, actionable insight, from</text><text class="f" x="40" y="162" font-size="15" font-weight="400" fill="#CBD5E1" text-anchor="start" >interactive dashboards