<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="Featured Projects"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#121D3D"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17274F"/><stop offset="1" stop-color="#0F1A36"/></linearGradient><clipPath id="clip"><rect width="1000" height="64" rx="16"/></clipPath></defs><style>.f{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.rise{animation:rise .9s ease-out backwards}.n{animation:pulse 3.4s ease-in-out infinite}.cur{animation:blink 1s steps(1) infinite}</style><rect width="1000" height="64" rx="16" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="900" cy="0" r="160" fill="#6366F1" fill-opacity="0.12"/><rect x="40" y="20" width="5" height="28" rx="2.5" fill="url(#acc)"/><text class="f" x="58" y="41" font-size="24" font-weight="700" fill="#F1F5F9" text-anchor="start" >Featured Projects</text><text class="f" x="960" y="39" font-size="13" font-weight="500" fill="#64748B" text-anchor="end" >Click a card to open the repository</text></g><rect x=".5" y=".5" width="999" height="63" rx="16" fill="none" stroke="#1E3A66" stroke-opacity=".8"/></svg>